name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v6.0.0)
        required: true
        type: string
permissions: {}
concurrency:
  group: release
  queue: max
  cancel-in-progress: false
jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.check-tag.outputs.commit }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout tag
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read development runtime
        id: runtime
        run: node -p "'node=' + require('./package.json').devEngines.runtime.version" >> "$GITHUB_OUTPUT"
      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}
          cache: npm
      - name: Check tag matches package.json and is on the default branch
        id: check-tag
        timeout-minutes: 1
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "::error::$TAG is not on $DEFAULT_BRANCH" >&2
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci --ignore-scripts
      - name: Lint
        timeout-minutes: 5
        run: npm run lint
      - name: Build
        timeout-minutes: 5
        run: npm run build
      - name: Typecheck
        timeout-minutes: 5
        run: npm run typecheck
      - name: Test
        timeout-minutes: 10
        run: |
          npm run test-cov
          git diff --exit-code
      - name: Upload checked build
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tag
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download checked build
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/
      - name: Publish
        timeout-minutes: 5
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { name, version } = require('./package.json');
          function view(spec, field) {
            const queryArguments = ['view', spec, field, '--json'];
            try {
              const output = execFileSync('npm', queryArguments, { encoding: 'utf8' });
              if (output.trim() === '') return '';
              const result = JSON.parse(output);
              return result;
            } catch (error) {
              const response = JSON.parse(error.stdout || '{}');
              if (response.error?.code === 'E404') return;
              throw error;
            }
          }
          function stableTag() {
            const newer = view(`${name}@>${version}`, 'version');
            if (!newer) return 'latest';
            const major = version.split('.', 1)[0];
            const distributionTag = `v${major}-latest`;
            const current = view(name, `dist-tags.${distributionTag}`);
            if (!current) return distributionTag;
            const ahead = view(`${name}@${current} >=${version}`, 'version');
            if (ahead) {
              throw new Error(`${version} would move ${distributionTag} backward from ${current}`);
            }
            return distributionTag;
          }
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const publishedHead = view(`${name}@${version}`, 'gitHead');
          const isPublished = publishedHead !== undefined;
          if (isPublished) {
            if (publishedHead !== head) {
              throw new Error(`${name}@${version} is already published from a different or unknown commit`);
            }
            process.stdout.write(`${name}@${version} is already published from this commit; skipping\n`);
          } else {
            if (process.env.GITHUB_SHA !== head) {
              throw new Error(`GITHUB_SHA ${process.env.GITHUB_SHA} differs from the checked-out commit ${head}; dispatch with the tag as the workflow ref`);
            }
            const precedence = version.split('+', 1)[0];
            const isPrerelease = precedence.includes('-');
            const distributionTag = isPrerelease ? 'next' : stableTag();
            const publishArguments = ['publish', '--ignore-scripts', '--tag', distributionTag];
            execFileSync('npm', publishArguments, { stdio: 'inherit' });
          }
          NODE
  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create release
        timeout-minutes: 2
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --generate-notes $prerelease
