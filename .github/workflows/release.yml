name: Release
on:
  push:
    tags:
      - "v*"
permissions: {}
concurrency:
  group: release
  queue: max
  cancel-in-progress: false
jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check stable tag and default branch
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$TAG" != "v$version" ]; then
            echo "::error::Expected a stable tag matching package.json: v$version" >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: tmp/artifacts
      - name: Publish checked package
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const { readdirSync, readFileSync } = require('node:fs');
          const { name, version } = require('./package.json');
          const directory = 'tmp/artifacts';
          const artifacts = readdirSync(directory).filter((file) => file.endsWith('.tgz'));
          if (artifacts.length !== 1) throw new Error('Expected exactly one checked tarball');
          const tarball = `${directory}/${artifacts[0]}`;
          const bytes = readFileSync(tarball);
          const digest = createHash('sha512').update(bytes).digest('base64');
          const integrity = `sha512-${digest}`;
          const candidate = version.split('.').map((part) => BigInt(part));

          publish();

          function publish() {
            const versions = view(name, 'versions');
            const validVersions = Array.isArray(versions) && versions.every((item) => typeof item === 'string');
            if (!validVersions) throw new Error('Invalid registry versions metadata');
            if (versions.includes(version)) {
              const recorded = view(`${name}@${version}`, 'dist.integrity');
              if (recorded !== integrity) throw new Error('Published tarball integrity differs from the checked artifact');
              process.stdout.write(`${name}@${version} is already published with matching integrity; skipping\n`);
              return;
            }
            if (versions.some(isNewerStable)) throw new Error('A newer stable version is already published');
            const args = ['publish', tarball, '--ignore-scripts'];
            execFileSync('npm', args, { stdio: 'inherit' });
          }

          function view(spec, field) {
            const args = ['view', spec, field, '--json'];
            const output = execFileSync('npm', args, { encoding: 'utf8' });
            const result = JSON.parse(output);
            return result;
          }

          function isNewerStable(published) {
            const [precedence] = published.split('+');
            if (!/^\d+\.\d+\.\d+$/.test(precedence)) return false;
            const components = precedence.split('.').map((part) => BigInt(part));
            const index = components.findIndex((part, position) => part !== candidate[position]);
            const newer = index !== -1 && components[index] > candidate[index];
            return newer;
          }
          NODE
