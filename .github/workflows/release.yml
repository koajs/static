name: Release
on:
  push:
    tags:
      - "v*"
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check stable tag and default branch
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$TAG" != "v$version" ]; then
            echo "::error::Expected a stable tag matching package.json: v$version" >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: tmp/artifacts
      - name: Publish checked package
        run: npm publish tmp/artifacts/koa-static-*.tgz --ignore-scripts
